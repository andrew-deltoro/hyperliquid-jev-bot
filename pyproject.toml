[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-jev-bot"
version = "0.2.1"
description = "Read-only Hyperliquid regime analysis and JEV strategy decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
jevbot = "jevbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
