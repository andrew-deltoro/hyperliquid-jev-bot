mode = "analysis"
database = "data/journal.sqlite3"
symbols = ["BTC", "ETH"]
auto_select = false
active_limit = 8
poll_seconds = 60
lookback_bars = 180
data_max_age_seconds = 150
decision_ttl_seconds = 20
route_dwell_bars = 3
route_refresh_bars = 5
jev_model = "jev-1.13.0"
jev_timeout_seconds = 8
max_jev_calls_per_hour = 30
skylark_health = true
# Optional local file of legitimately obtained Skylark readings.
# No automatic paid fetch is implemented.
skylark_readings_file = ""
skylark_max_age_days = 10

[preview]
# Hypothetical sizing only. NOT the user's balance or live authorization.
reference_equity = 1000
risk_fraction = 0.0025
max_leverage = 3
max_notional_fraction = 1
cost_buffer_bps = 12

[shadow]
enabled = true
baseline_profile = "standard"
# Hypothetical costs, NOT the actual fee tier or funding rate of an account.
fee_bps_per_side = 4.5
slippage_bps_per_side = 2
# Conservative flat hourly debit applied to both long and short tickets.
funding_cost_bps_per_hour = 0.5

[improvement]
enabled = true
interval_hours = 6
# Descriptive labels only; these never block strategy execution or shadow entries.
min_closed = 20
min_days = 3
recent_closed = 20
drawdown_review_r = 6
# At most one extra review call per interval, using the existing shared hourly cap.
jev_review = true
max_ideas_per_review = 3
